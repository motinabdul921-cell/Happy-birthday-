<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Secret Awaits You 🔒</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #2d1b4e, #130a21);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 350px;
            width: 90%;
        }
        h2 { color: #ffd166; margin-bottom: 10px; }
        p { color: #dcd6f7; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 80%;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #ffd166;
            background: transparent;
            color: #fff;
            text-align: center;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
        }
        button {
            width: 88%;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.03); }
        .error { color: #ff6b6b; font-size: 13px; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>A Secret Awaits You ✨</h2>
        <p>Something magical has been prepared just for you...</p>
        
        <input type="password" id="secretKey" placeholder="Enter secret key...">
        <button onclick="checkKey()">Open the Magic 🔑</button>
        
        <p class="error" id="errorMsg">Wrong secret key! Try again 🤫</p>
    </div>

    <script>
function checkKey() {
    const userKey = document.getElementById('secretKey').value;
    if (userKey === "8364") {
        const music = document.getElementById('bgMusic');
        if (music) {
            music.play();
            localStorage.setItem('audioTime', music.currentTime);
        }
        setTimeout(() => {
            window.location.href = "special.html";
        }, 300);
    } else {
        document.getElementById('errorMsg').style.display = 'block';
    }
}
</script>
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>
</body>
