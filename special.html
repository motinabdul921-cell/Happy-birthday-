<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Special... ✨</title>
    <style>
        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 20px;
            animation: float 5s linear;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #2d1b4e, #130a21);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 90%;
            padding: 20px;
        }
        .sub-title { color: #f472b6; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
        h1 { color: #ffd166; font-size: 32px; margin-bottom: 20px; font-weight: 700; line-height: 1.3; }
        p { color: #dcd6f7; font-size: 16px; line-height: 1.6; font-style: italic; margin-bottom: 30px; }
        .timer-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #f472b6;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            font-size: 32px;
            font-weight: bold;
            color: #ffd166;
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sub-title">✨ A SPECIAL SURPRISE ✨</div>
        <h1>There Is Something<br>Very Special Waiting<br>For You...</h1>
        <p>Close your eyes for just a moment...<br>Take a deep breath...<br>Because what comes next was made with all the love in the universe — just for you. 🌙</p>
        
        <div class="timer-circle" id="countdown">10</div>
    </div>

    <script>
    let timeLeft = 10;
    const countdownEl = document.getElementById('countdown');

    const timer = setInterval(() => {
        timeLeft--;
        countdownEl.textContent = timeLeft;
        
        if (timeLeft <= 0) {
            clearInterval(timer);
            window.location.href = "cake.html";
        }
    }, 1000);
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = Math.random() > 0.5 ? '💖' : '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 200);
</script>
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const music = document.getElementById('bgMusic');
        const savedTime = localStorage.getItem('audioTime');

        if (music) {
            if (savedTime) {
                music.currentTime = parseFloat(savedTime);
            }
            music.play().catch(() => {});

            music.ontimeupdate = () => {
                localStorage.setItem('audioTime', music.currentTime);
            };
        }
    });
</script>
</body>
</html>
